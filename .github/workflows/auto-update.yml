name: Auto-update upstream versions

# 自动跟踪上游并触发重建（只负责「检测 + bump + 提交」，不负责发布）：
#
#   1. hermes-web-ui：跟踪官方 GitHub Release（EKKOLearnAI/ekko-studio）中
#      「同时带 hermes-web-ui-<ver>.tar.gz 与其 .sha256 sidecar」的最新版本。
#      该 release 线被官方显式标记为非 latest，所以不能取 releases/latest，
#      必须自行过滤版本标签并按 published_at 取最新。
#      注意：同一仓库还会发手机端 release（如 v1.0.4 只含 .apk）—— 必须按
#      「是否带预构建产物」过滤，否则手机端版本会抢先入选、再因缺少预构建
#      产物校验失败而中止整天更新。
#
#   2. hermes-agent：跟踪 NousResearch/hermes-agent 最新 release 标签
#      （日期式标签，如 v2026.9.24）。
#
# ⚠️ 发布职责归属：本 workflow 【不建 Release、不传资产】。
#    Release 由 build.yml 独占（一个 Release 只能有一个归属方）。
#
# ⚠️ 所有 api.github.com 调用必须带 Authorization：Actions runner 的出口 IP
#    为 GitHub 全平台共享，未鉴权请求走 60 次/小时的 IP 级配额。
#    上游探测逻辑集中在 scripts/detect-upstream.py，可在本机直接跑（便于验证）。
#
# ─────────────────────────────────────────────────────────────────────────────
# 为什么是「长驻轮询」而不是普通 cron（2026-10-02 实测，这是本文件的核心设计）
#
# GitHub 的 `on: schedule` 对公共仓极不可靠，实测：
#   · 单槽位 '23 */2 * * *'（12 次/天）：162h 内只触发 29/81 次 = 36%
#   · 29 次触发【0 次】落在预期分钟 :23 上，全部晚 2~59 分钟
#     → 主体机制是「延迟投递」，不是准点投递
#   · 改成 '*/5'（288 次/天）后实测 54 分钟 0 触发 → 加密无效
#   · 同账号另一仓同期也静默 → 不是本仓配置问题，是账号/平台级降权
#
# 所以「靠提高 cron 频率来及时跟上上游」这条路走不通。改成：
#
#   单次 job 内部【每 TICK_INTERVAL 秒】调一次 scripts/auto-update-tick.sh，
#   持续到接近 job 时限（JOB_SECONDS），然后退出；
#   再用 concurrency(cancel-in-progress=false) 让下一次 cron 触发【排队】，
#   当前 job 一结束就无缝接管。
#
# 于是链路对 cron 的要求从「必须按时触发」降级为「每 JOB_SECONDS 内成功点火一次」。
# 以 6 小时 job + 每 5 分钟 cron 计：要连续 6 小时、72 个槽位全丢才会断，
# 而实测守约率 36% 下「连续 72 次全丢」概率约 0.64^72 ≈ 1e-14。
# 即：cron 仍然不可靠，但**链路实际是 24 小时连续覆盖的**。
#
# 冗余无害：tick 内部先比对版本，无变化直接退出（幂等）；
#          build.yml 的 gate 以「本仓是否已有该版本 Release」为幂等键。

on:
  schedule:
    # 只负责「点火」。真正的检查由长驻 job 内部循环完成，故无需高频 cron。
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write     # 长驻期间主动 dispatch build.yml 需要

# 串行化 + 排队：让下一个 cron 触发等待当前长驻 job 结束，实现无缝续跑。
# cancel-in-progress 必须 false —— 设 true 会杀掉正在跑的长驻 job，链路直接断。
concurrency:
  group: auto-update-upstream
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # job 时限。GitHub 单 job 上限 6 小时；留 10 分钟余量给收尾与下一次点火。
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0        # 长驻期间要 rebase，需要完整历史

      - name: Poll upstream continuously
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          chmod +x scripts/auto-update-tick.sh

          TICK_INTERVAL=300          # 每 5 分钟巡检一次
          JOB_SECONDS=20400          # 5h40m（留足余量给 6h 上限）
          START=$(date +%s)

          echo "长驻轮询启动：每 ${TICK_INTERVAL}s 巡检一次，最长 ${JOB_SECONDS}s"
          echo "起止：$(date -u '+%H:%M:%S')Z 起"

          i=0
          while :; do
            i=$((i+1))
            echo "──────── tick #${i} ────────"
            bash scripts/auto-update-tick.sh || echo "tick 返回非零，继续（长驻不因单次失败中断）"

            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            if [ "${ELAPSED}" -ge "${JOB_SECONDS}" ]; then
              echo "已达本次 job 时限（${ELAPSED}s），正常退出，等待下一次 cron 无缝接管"
              break
            fi
            sleep "${TICK_INTERVAL}"
          done

          echo "长驻轮询结束：共 ${i} 次 tick"
